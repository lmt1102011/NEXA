<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f14" />
    <title>NEXA — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0e0f14;
        color: #edeff5;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 32px 28px;
        background: #14151c;
      }
      .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: #f5b544; margin: 0 auto 16px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
      p { font-size: 13.5px; color: #a2a7ba; margin: 0 0 20px; line-height: 1.6; }
      button {
        font: inherit; font-size: 13.5px; font-weight: 500;
        color: #fff; background: #665ef2; border: 0; border-radius: 10px;
        padding: 10px 18px; cursor: pointer;
      }
      button:hover { background: #7a72f6; }
      @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"></div>
      <h1>You're offline</h1>
      <p>NEXA needs an internet connection to connect to rooms. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
